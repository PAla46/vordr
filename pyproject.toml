[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vordr"
version = "0.1.0"
description = "Anonymous-boundary API security assessment: authentication, transport, disclosure and rate-limit posture, without credentials."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pala" }]
keywords = ["api", "security", "owasp", "audit", "dast", "assessment"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = [
  "httpx>=0.27",
  "openpyxl>=3.1",
  "pyyaml>=6.0",
]

[project.scripts]
vordr = "vordrlib.cli:run"

[project.urls]
Homepage = "https://github.com/PAla46/vordr"

[tool.hatch.build.targets.wheel]
packages = ["vordrlib"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "PIE", "ISC", "BLE", "EXE"]
ignore = ["N999"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["BLE001"]
