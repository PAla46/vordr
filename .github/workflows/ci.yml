name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  # Deliberately uses pip rather than uv: the tool must work with plain Python.
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt ruff
      - name: Lint
        run: ruff check vordr.py vordrlib tests
      - name: Compile
        run: python -m compileall -q vordrlib vordr.py
      - name: CLI smoke
        run: python vordr.py --version
      - name: End-to-end against the fixture API
        run: ./tests/smoke.sh
